[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perfora-api"
version = "0.2.0"
description = "Local-first API and job runner for Perfora"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.35,<1"
]

[project.scripts]
perfora = "perfora.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["perfora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
